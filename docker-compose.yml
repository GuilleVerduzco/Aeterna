services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      API_KEYS: ${API_KEYS:-changeme-local-dev-key}
      GOOGLE_PAGESPEED_API_KEY: ${GOOGLE_PAGESPEED_API_KEY:-}
      MAX_CONCURRENT_ANALYSES: ${MAX_CONCURRENT_ANALYSES:-2}
      ANALYSIS_TIMEOUT_MS: ${ANALYSIS_TIMEOUT_MS:-120000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
