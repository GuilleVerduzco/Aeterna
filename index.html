<style>
:root{--page:#f4f5f2;--surface:#fcfcfb;--raised:#fff;--ink:#111312;--ink-2:#4d524f;--muted:#7b807c;--ring:rgba(17,19,18,.09);--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--good:#0ca30c;--crit:#d03b3b;--sans:"Schibsted Grotesk",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root{--page:#0f100f;--surface:#1a1b1a;--raised:#202221;--ink:#f3f4f1;--ink-2:#c1c4bc;--muted:#8e928c;--ring:rgba(255,255,255,.09);--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--good:#8fd88f;--crit:#f19a9a}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font:14px/1.5 var(--sans);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
main{max-width:1100px;margin:0 auto;display:grid;gap:18px;min-width:0}
header{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.logo{width:40px;height:40px;border-radius:9px;background:#0D1117;color:#F4F1EA;display:grid;place-items:center;font:400 30px/1 "Instrument Serif",Georgia,serif}
.logo i{color:#C9A96E;font-style:normal}
h1{margin:0;font:400 30px/1.1 "Instrument Serif",Georgia,serif}
.sub{color:var(--muted);font-size:13px}
.panel{background:var(--surface);border:1px solid var(--ring);border-radius:14px;padding:18px clamp(16px,2.4vw,22px);display:grid;gap:12px;min-width:0}
.panel h2{margin:0;font-size:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--raised);border:1px solid var(--ring);border-radius:12px;padding:12px 14px}
.kpi b{display:block;font:700 26px/1.1 var(--sans);font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.card{background:var(--raised);border:1px solid var(--ring);border-radius:12px;padding:14px;display:grid;gap:8px;min-width:0}
.card h3{margin:0;font-size:15px}
.tag{font:600 11px var(--mono);padding:2px 8px;border-radius:999px;background:var(--page);color:var(--ink-2);white-space:nowrap}
.tag.on{color:var(--good)}.tag.off{color:var(--muted)}.tag.bad{color:var(--crit)}
.bar{height:8px;border-radius:99px;background:var(--page);overflow:hidden;display:flex}
.bar div{height:100%}
.muted{color:var(--muted)}
.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 6px;border-bottom:1px solid var(--ring);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
a{color:var(--s1)}
.alert{border-left:3px solid var(--s4);padding:6px 10px;background:var(--raised);border-radius:8px}
.alert.alta{border-color:var(--crit)}
.alert.baja{border-color:var(--s1)}
.alert b{display:block}
@media (prefers-reduced-motion:no-preference){.panel{animation:in .4s ease both}@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>
</head>

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const v = x => (x === null || x === undefined) ? '<span class="muted">sin dato</span>' : esc(x);
const dt = iso => { try { return new Date(iso).toLocaleString('es-MX',{dateStyle:'medium',timeStyle:'short'}); } catch { return iso; } };
const estadoTag = e => /en curso|activ|publicad|ok|listo|activo/.test(String(e)) ? 'on' : /error|bad/.test(String(e)) ? 'bad' : 'off';

document.getElementById('stamp').textContent = `Datos al ${dt(C.generado)}`;

const totPub = C.campanas.filter(c => !c.unidad).reduce((a, c) => a + (c.publicadas || 0), 0) + (C.retail.posts.filter(p => String(p.estado).startsWith('publicada')).length);
const totProg = C.campanas.reduce((a, c) => a + (c.programadas || 0), 0);
const totErr = C.campanas.reduce((a, c) => a + (c.errores || 0), 0);
document.getElementById('kpis').innerHTML = [
  ['Campañas vivas', C.campanas.filter(c => c.estado !== 'reemplazada').length],
  ['Publicaciones hechas', totPub],
  ['Programadas', totProg],
  ['Con error', totErr],
  ['Seguidores @c4b_mx', C.ig.followers],
  ['Alcance 11–17 oct', C.ig.reach_7d],
].map(([l, n]) => `<div class="kpi"><b>${esc(n)}</b><span>${esc(l)}</span></div>`).join('');

document.getElementById('camps').innerHTML = C.campanas.filter(c => c.estado !== 'reemplazada').map(c => {
  const total = c.total || 0, pub = c.publicadas || 0, pct = total ? Math.round(pub / total * 100) : 0;
  return `<article class="card"><div class="row"><h3>${esc(c.nombre)}</h3><span class="tag ${estadoTag(c.estado)}">${esc(c.estado)}</span></div>
    <div class="muted">${esc(c.canal)} · ${esc(c.cuenta)}</div>
    <div class="row"><span>${pub} de ${total} ${esc(c.unidad || 'publicaciones')}</span><span>${pct} %</span></div>
    <div class="bar" aria-hidden="true"><div style="width:${pct}%;background:var(--s3)"></div></div>
    <div class="row muted"><span>Programadas ${esc(c.programadas ?? 0)}</span><span>Errores ${esc(c.errores ?? 0)}</span></div>
    <div class="muted">${esc(c.agente)}</div></article>`;
}).join('');

document.getElementById('posts').innerHTML = C.retail.posts.map(p => {
  const link = p.enlace ? (typeof p.enlace === 'string' ? `<a href="${esc(p.enlace)}" target="_blank" rel="noopener">Abrir</a>` : `<a href="${esc(p.enlace.instagram)}" target="_blank" rel="noopener">Instagram</a>`) : '<span class="muted">sin dato</span>';
  return `<tr><td>${esc(p.id)}</td><td>${esc(p.fecha)}</td><td>${esc(p.hora)}</td><td>${esc(p.tema)}</td><td><span class="tag ${estadoTag(p.estado)}">${esc(p.estado)}</span></td><td>${link}</td></tr>`;
}).join('');

document.getElementById('teams').innerHTML = C.equipos.map(t => `<article class="card"><div class="row"><h3>${esc(t.nombre)}</h3><span class="tag ${estadoTag(t.estado)}">${esc(t.estado)}</span></div>
  <div class="muted">${esc(t.cuenta)}</div><div>${esc(t.rol)}</div><div class="row muted"><span>Hechas ${v(t.hechas)} de ${v(t.total)}</span><span>${esc(t.ritmo)}</span></div></article>`).join('');

document.getElementById('alerts').innerHTML = C.alertas.map(a => `<div class="alert ${esc(a.nivel)}"><b>${esc(a.titulo)}</b><span>${esc(a.texto)}</span>${a.accion ? `<div class="muted">Qué hacer: ${esc(a.accion)}</div>` : ''}</div>`).join('');

document.getElementById('ig').innerHTML = `<article class="card"><h3>@c4b_mx</h3><div class="row"><span>Seguidores</span><b>${esc(C.ig.followers)}</b></div><div class="row"><span>Publicaciones</span><b>${esc(C.ig.media_count)}</b></div><div class="muted">${esc(C.ig.nota || '')}</div></article>
  <article class="card"><h3>@aeterna_ig</h3><div class="row"><span>Seguidores</span><b>${esc(C.aeterna_ig?.followers ?? '—')}</b></div><div class="row"><span>Publicaciones</span><b>${esc(C.aeterna_ig?.media_count ?? '—')}</b></div></article>`;
